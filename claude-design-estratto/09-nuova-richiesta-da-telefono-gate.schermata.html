<!DOCTYPE html>
<html lang="it"><head>
<meta charset="utf-8">
<title>Nuova richiesta da telefono · Gate</title>
<!-- runtime di Claude Design rimosso; font: Sora e Manrope da Google Fonts -->
</head>
<body>
<x-dc>
<helmet>
<style></style>
<style>
body{margin:0}
a{color:hsl(195 55% 30%)}a:hover{color:hsl(195 55% 22%)}
button{font-family:inherit;cursor:pointer}
textarea{font-family:inherit}
:focus-visible{outline:3px solid hsl(170 55% 45%);outline-offset:2px}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; display: flex; flex-direction: column; overflow: hidden; background: hsl(210 30% 98%); color: hsl(210 50% 10%); font-family: Manrope, system-ui, sans-serif; font-size: 15px; line-height: 1.45">

<header style="flex: none; display: flex; align-items: center; gap: 4px; padding: 10px 8px; background: #ffffff; border-bottom: 1px solid hsl(210 20% 88%)">
<a href="Oggi-telefono.dc.html" aria-label="Torna a Oggi" style="width: 44px; height: 44px; display: inline-flex; align-items: center; justify-content: center; color: hsl(210 60% 20%)">
<svg width="22" height="22" sc-camel-view-box="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m12 19-7-7 7-7M19 12H5"></path></svg>
</a>
<h1 style="margin: 0; font-family: Sora, sans-serif; font-size: 19px; color: hsl(210 60% 20%)">Nuova richiesta</h1>
</header>

<sc-if value="{{ salvata }}" hint-placeholder-val="{{ false }}">
<div role="status" style="flex: 1; padding: 40px 24px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 14px; text-align: center">
<span style="width: 64px; height: 64px; border-radius: 999px; background: hsl(152 55% 93%); color: hsl(152 60% 28%); display: inline-flex; align-items: center; justify-content: center">
<svg width="32" height="32" sc-camel-view-box="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 6 9 17l-5-5"></path></svg>
</span>
<h2 style="margin: 0; font-family: Sora, sans-serif; font-size: 22px; color: hsl(210 60% 20%)">Richiesta salvata</h2>
<p style="margin: 0; color: hsl(210 50% 18%)">Annotata in 46 secondi. È in Oggi: richiamare Marta R. entro le 12:00.</p>
<a href="Oggi-telefono.dc.html" style="display: flex; align-items: center; justify-content: center; min-height: 50px; width: 100%; box-sizing: border-box; border-radius: 12px; background: hsl(195 55% 35%); color: #ffffff; font-weight: 700; text-decoration: none">Vai a Oggi</a>
<button type="button" sc-camel-on-click="{{ ricomincia }}" style="min-height: 44px; border: 0; background: none; color: hsl(195 55% 30%); font-size: 15px; font-weight: 600; text-decoration: underline">Registra un'altra richiesta</button>
</div>
</sc-if>

<sc-if value="{{ inCorso }}" hint-placeholder-val="{{ true }}">
<div style="flex: 1; min-height: 0; overflow-y: auto; padding: 16px; display: flex; flex-direction: column; gap: 14px">
<div style="display: flex; flex-direction: column; gap: 6px">
<label for="nota-tel" style="font-weight: 600; font-size: 14px">Incolla il messaggio o scrivi due righe</label>
<textarea id="nota-tel" rows="5" value="{{ nota }}" sc-camel-on-change="{{ cambiaNota }}" style="padding: 10px 12px; border: 1px solid hsl(210 15% 56%); border-radius: 10px; font-size: 15px; line-height: 1.5; color: hsl(210 50% 10%); resize: none"></textarea>
</div>
<div style="display: flex; flex-direction: column; gap: 6px">
<p id="canale-tel" style="margin: 0; font-weight: 600; font-size: 14px">Da dove arriva</p>
<div role="group" aria-labelledby="canale-tel" style="display: flex; flex-wrap: wrap; gap: 6px">
<sc-for list="{{ canali }}" as="c" hint-placeholder-count="5">
<button type="button" aria-pressed="{{ c.premuto }}" sc-camel-on-click="{{ c.scegli }}" style="min-height: 40px; padding: 0 12px; border-radius: 999px; border: 2px solid {{ c.bordo }}; background: {{ c.sfondo }}; color: hsl(210 50% 14%); font-size: 14px; font-weight: 600">{{ c.nome }}</button>
</sc-for>
</div>
</div>
<sc-if value="{{ nonLetta }}" hint-placeholder-val="{{ false }}">
<button type="button" sc-camel-on-click="{{ leggi }}" style="min-height: 48px; border: 2px solid hsl(195 55% 35%); border-radius: 12px; background: #ffffff; color: hsl(195 55% 28%); font-size: 15px; font-weight: 700">Compila i campi dalla nota</button>
</sc-if>
<sc-if value="{{ letta }}" hint-placeholder-val="{{ true }}">
<section aria-label="Campi proposti" style="background: #ffffff; border: 1px solid hsl(210 20% 88%); border-radius: 14px; padding: 4px 14px">
<dl style="margin: 0">
<sc-for list="{{ campi }}" as="f" hint-placeholder-count="7">
<div style="display: flex; align-items: center; gap: 10px; min-height: 40px; padding: 6px 0; border-top: {{ f.bordo }}">
<dt style="flex: none; width: 96px; font-size: 13px; color: hsl(210 15% 42%)">{{ f.etichetta }}</dt>
<dd style="flex: 1; min-width: 0; margin: 0; font-weight: 600; font-size: 14px">{{ f.valore }}</dd>
<span style="flex: none; padding: 1px 7px; border-radius: 999px; font-size: 11px; font-weight: 700; background: {{ f.tagSfondo }}; color: {{ f.tagColore }}">{{ f.tag }}</span>
</div>
</sc-for>
</dl>
</section>
<p style="margin: 0; font-size: 12px; color: hsl(210 15% 42%)">Proposta automatica con regole fisse: controlla i campi segnati. Niente si salva senza di te.</p>
</sc-if>
</div>
<div style="flex: none; padding: 12px 16px 16px; background: #ffffff; border-top: 1px solid hsl(210 20% 88%)">
<button type="button" sc-camel-on-click="{{ salva }}" disabled="{{ nonSalvabile }}" style="display: flex; align-items: center; justify-content: center; gap: 8px; min-height: 52px; width: 100%; border: 0; border-radius: 12px; background: {{ coloreSalva }}; color: #ffffff; font-size: 16px; font-weight: 700">
<svg width="18" height="18" sc-camel-view-box="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 6 9 17l-5-5"></path></svg>
Salva la richiesta
</button>
</div>
</sc-if>

</div>
</x-dc>
<script type="text/x-dc" data-dc-script="" data-props="{&quot;$preview&quot;:{&quot;width&quot;:390,&quot;height&quot;:844}}">
class Component extends DCLogic {
  renderVals() {
    const s = this.state || {};
    const nota = s.nota ?? "Buongiorno, sono Marta R. dello Studio Commercialisti Omega di Modugno. Cerchiamo un'impresa per le pulizie dello studio: circa 180 mq, due volte a settimana, da novembre. Potete richiamarmi al 300 000 0003?";
    const canale = s.canale ?? "WhatsApp";
    const canali = ["Telefono", "WhatsApp", "Email", "Sito", "Passaparola"].map((nome) => ({
      nome,
      premuto: nome === canale ? "true" : "false",
      bordo: nome === canale ? "hsl(195 55% 35%)" : "hsl(210 15% 75%)",
      sfondo: nome === canale ? "hsl(195 55% 94%)" : "#ffffff",
      scegli: () => this.setState({ canale: nome })
    }));
    const tag = {
      nota: { tag: "dalla nota", tagSfondo: "hsl(170 50% 92%)", tagColore: "hsl(170 60% 22%)" },
      proposto: { tag: "controlla", tagSfondo: "hsl(210 60% 94%)", tagColore: "hsl(210 60% 28%)" }
    };
    const campi = [
      ["Azienda", "Studio Commercialisti Omega", "nota"],
      ["Referente", "Marta R.", "nota"],
      ["Telefono", "300 000 0003", "nota"],
      ["Comune", "Modugno", "nota"],
      ["Settore", "Uffici e studi", "proposto"],
      ["Metri quadri", "180", "nota"],
      ["Frequenza", "2 volte a settimana", "nota"],
      ["Avvio", "Da novembre", "nota"]
    ].map(([etichetta, valore, o], i) => ({ etichetta, valore, ...tag[o], bordo: i === 0 ? "0" : "1px solid hsl(210 20% 92%)" }));
    const nonSalvabile = !s.letta;
    return {
      nota,
      canali,
      campi,
      letta: !!s.letta,
      nonLetta: !s.letta,
      salvata: !!s.salvata,
      inCorso: !s.salvata,
      nonSalvabile,
      coloreSalva: nonSalvabile ? "hsl(195 20% 65%)" : "hsl(195 55% 35%)",
      cambiaNota: (e) => this.setState({ nota: e.target.value }),
      leggi: () => this.setState({ letta: true }),
      salva: () => { if (s.letta) this.setState({ salvata: true }); },
      ricomincia: () => this.setState({ salvata: false, letta: false, nota: "" })
    };
  }
}
</script>


</body></html>
